<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吉他譜架</title>
<meta name="theme-color" content="#1f2933">
<style>
:root {
  --bg: #f4f1ea; --fg: #1f2933; --muted: #6b7280; --card: #ffffff; --line: #e5e1d8;
  --accent: #2f7d5b; --accent-fg: #ffffff; --bar: rgba(31, 41, 51, .94); --bar-fg: #f9fafb;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15191e; --fg: #e5e7eb; --muted: #9ca3af; --card: #1f252c; --line: #2d353e; --accent: #4fb386; --accent-fg: #0b1410; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.hidden { display: none !important; }

/* ── 譜架 ── */
#home { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
#home header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
#home h1 { font-size: 24px; margin: 0; }
#status { color: var(--muted); font-size: 14px; flex: 1; }
#connectBtn { color: var(--accent); font-size: 14px; }
#list { display: grid; gap: 10px; }
.tab { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.tab:hover { border-color: var(--accent); }
.tab .t { font-size: 18px; font-weight: 600; }
.tab .m { color: var(--muted); font-size: 13px; }
.tab .grow { flex: 1; min-width: 0; }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
#connect { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
#connect p { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
#connect input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
#connect .row { display: flex; gap: 8px; margin-top: 10px; }
.btn { padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }

/* ── 看譜 ── */
#viewer { position: fixed; inset: 0; background: #fff; color: #1f2933; }
#scroller { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: 72px; }
#score { max-width: 1400px; margin: 0 auto; }
#msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 15px; pointer-events: none; text-align: center; padding: 24px; }
/* alphaTab 播放游標 */
.at-cursor-bar { background: rgba(47, 125, 91, .08); }
.at-cursor-beat { background: rgba(47, 125, 91, .75); width: 3px; }
.at-highlight * { fill: #2f7d5b; stroke: #2f7d5b; }
.at-selection div { background: rgba(47, 125, 91, .15); }

#bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 2px; flex-wrap: wrap; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--bar); color: var(--bar-fg); font-size: 15px; transition: transform .2s; z-index: 5; }
#viewer.bar-off #bar { transform: translateY(110%); }
#bar button { min-width: 40px; height: 40px; padding: 0 9px; border-radius: 8px; color: var(--bar-fg); white-space: nowrap; }
#bar button:hover { background: rgba(255,255,255,.12); }
#bar button.on { background: #2f7d5b; }
#bar button:disabled { opacity: .4; }
#bar .title { flex: 1; min-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
#bar .sep { width: 1px; height: 24px; background: rgba(255,255,255,.2); margin: 0 3px; }
#bar .lbl { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; }
@media (max-width: 640px) {
  #bar .title, #bar .sep { display: none; }
  #bar button { min-width: 34px; padding: 0 6px; }
  #bar .lbl { min-width: 0; font-size: 13px; }
}
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--bar); color: var(--bar-fg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
#toast.on { opacity: 1; }
</style>
</head>
<body>

<main id="home">
  <header>
    <h1>吉他譜架</h1>
    <span id="status"></span>
    <button id="connectBtn" type="button">連線設定</button>
  </header>
  <section id="connect" class="hidden">
    <p>譜存在私有 repo 的 <code>saves/guitartab/</code>。這台裝置的瀏覽器連過 K書吧的話會自動沿用那組 token；沒有的話貼一次（只授權那個 repo、Contents 可讀即可）。</p>
    <input id="tokenInput" type="password" placeholder="GitHub fine-grained token" autocomplete="off">
    <input id="repoInput" type="text" placeholder="帳號/repo（預設 agan0617/CloudSave）" autocomplete="off" style="margin-top:8px">
    <div class="row"><button class="btn" id="saveConn" type="button">連線</button><button class="btn ghost" id="cancelConn" type="button">取消</button></div>
  </section>
  <div id="list"></div>
</main>

<section id="viewer" class="hidden" aria-label="看譜">
  <div id="scroller"><div id="score"></div></div>
  <div id="msg">載入中…</div>
  <nav id="bar">
    <button id="backBtn" type="button" title="回譜架（Esc）">‹ 譜架</button>
    <span class="title" id="vTitle"></span>
    <button id="playBtn" type="button" title="播放／暫停，游標會跟著走、譜自動捲（空白鍵）" disabled>▶ 播放</button>
    <button id="stopBtn" type="button" title="回到開頭（Home）" disabled>⏮</button>
    <button id="soundBtn" type="button" title="聲音開關：關掉時只有游標在走（M）">🔊</button>
    <button id="metroBtn" type="button" title="節拍器（K）">節拍器</button>
    <span class="sep"></span>
    <button id="slowBtn" type="button" title="慢一點（-）">－</button>
    <span class="lbl" id="speedLbl"></span>
    <button id="fastBtn" type="button" title="快一點（+）">＋</button>
    <span class="sep"></span>
    <button id="zoomOutBtn" type="button" title="譜縮小">A−</button>
    <button id="zoomInBtn" type="button" title="譜放大">A＋</button>
    <button id="fsBtn" type="button" title="全螢幕（F）">⛶</button>
  </nav>
</section>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js"></script>
<script>
'use strict';
/* ───────── 設定與本機儲存 ─────────
   跟 K書吧在同一個網域（agan0617.github.io），所以直接讀 K書吧存的連線設定（shuxia:gh），
   這台裝置的瀏覽器連過 K書吧就不用再貼 token。自己的設定存在 guitartab:* 底下。 */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const AT_BASE = 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/';
const DIR = 'saves/guitartab/';
const DEFAULT_CONN = { owner: 'agan0617', repo: 'CloudSave', branch: '', token: '' };
const conn = () => {
  const own = LS.get('guitartab:gh', null);
  const kbook = LS.get('shuxia:gh', null);
  return Object.assign({}, DEFAULT_CONN, (own && own.token) ? own : (kbook || {}));
};
const $ = id => document.getElementById(id);
const toast = (msg, ms = 1600) => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), ms); };
const encPath = p => p.split('/').map(encodeURIComponent).join('/');

/* ───────── GitHub ───────── */
async function ghText(path) {
  const c = conn();
  if (!c.token) throw Object.assign(new Error('還沒連線'), { code: 'notoken' });
  const q = c.branch ? '?ref=' + encodeURIComponent(c.branch) : '';
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encPath(DIR + path)}${q}`, {
    cache: 'no-store',
    headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github.raw' },
  });
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { code: 'http', status: r.status });
  return await r.text();
}

/* 譜檔（alphaTex 純文字）快取在 localStorage：updatedAt 沒變就不重抓，離線也能開 */
async function tabText(tab) {
  const key = 'guitartab:tex:' + tab.id, hit = LS.get(key, null);
  if (hit && hit.v === (tab.updatedAt || tab.addedAt)) return hit.text;
  try {
    const text = await ghText(tab.file);
    LS.set(key, { v: tab.updatedAt || tab.addedAt, text });
    return text;
  } catch (e) { if (hit) return hit.text; throw e; }
}

/* ───────── 譜架 ───────── */
let lib = LS.get('guitartab:lib', { tabs: [] });
const lastPlayed = () => LS.get('guitartab:last', {});

function renderList() {
  const last = lastPlayed();
  const tabs = lib.tabs.slice().sort((a, b) => (last[b.id] || 0) - (last[a.id] || 0) || String(b.addedAt).localeCompare(String(a.addedAt)));
  const list = $('list');
  if (!tabs.length) { list.innerHTML = `<div class="empty">${conn().token ? '譜架是空的' : '還沒連線：按右上角「連線設定」'}</div>`; return; }
  list.innerHTML = '';
  for (const t of tabs) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab';
    const meta = [t.artist, t.tempo ? `♩=${t.tempo}` : '', t.bars ? `${t.bars} 小節` : '', last[t.id] ? '上次 ' + new Date(last[t.id]).toLocaleDateString() : ''].filter(Boolean).join(' · ');
    b.innerHTML = `<span class="grow"><div class="t"></div><div class="m"></div></span><span aria-hidden="true">›</span>`;
    b.querySelector('.t').textContent = t.title;
    b.querySelector('.m').textContent = meta;
    b.onclick = () => openTab(t.id);
    list.appendChild(b);
  }
}

async function refreshLib() {
  const c = conn();
  if (!c.token) { $('status').textContent = '未連線'; renderList(); return; }
  $('status').textContent = '同步中…';
  try {
    const j = JSON.parse(await ghText('library.json'));
    lib = { tabs: Array.isArray(j.tabs) ? j.tabs : [] };
    LS.set('guitartab:lib', lib);
    $('status').textContent = `${c.owner}/${c.repo} · ${lib.tabs.length} 首`;
  } catch (e) {
    $('status').textContent = e.status === 404 ? '雲端還沒有譜' : e.status === 401 ? 'token 無效，請重新連線' : '離線，顯示上次的譜架';
  }
  renderList();
}

$('connectBtn').onclick = () => {
  const c = conn();
  $('repoInput').value = `${c.owner}/${c.repo}`;
  $('tokenInput').value = '';
  $('connect').classList.toggle('hidden');
};
$('cancelConn').onclick = () => $('connect').classList.add('hidden');
$('saveConn').onclick = () => {
  const token = $('tokenInput').value.trim();
  const [owner, repo] = ($('repoInput').value.trim() || 'agan0617/CloudSave').split('/');
  if (!token) { toast('請貼上 token'); return; }
  LS.set('guitartab:gh', { owner: owner || 'agan0617', repo: repo || 'CloudSave', branch: '', token });
  $('connect').classList.add('hidden');
  refreshLib();
};

/* ───────── 看譜（alphaTab） ─────────
   譜檔是 alphaTex。播放時游標照速度一拍一拍走、譜自動捲動；聲音關掉就只剩游標，當作自動捲譜用。
   速度、聲音、節拍器、縮放每首各自記住。 */
const V = { tab: null, api: null, playing: false, wake: null, barTimer: 0, pref: null };
const PREF0 = { speed: 100, sound: true, metro: false, scale: 1.0 };
const prefOf = id => Object.assign({}, PREF0, (LS.get('guitartab:pref', {})[id]) || {});
const savePref = () => { const all = LS.get('guitartab:pref', {}); all[V.tab.id] = V.pref; LS.set('guitartab:pref', all); };
const autoScale = () => innerWidth < 600 ? 0.7 : innerWidth < 1000 ? 0.95 : 1.15;

async function openTab(id) {
  const tab = lib.tabs.find(t => t.id === id);
  if (!tab) return;
  V.tab = tab; V.pref = prefOf(id); V.playing = false;
  const last = lastPlayed(); last[id] = Date.now(); LS.set('guitartab:last', last);
  $('home').classList.add('hidden');
  $('viewer').classList.remove('hidden', 'bar-off');
  $('vTitle').textContent = tab.title;
  $('msg').classList.remove('hidden'); $('msg').textContent = '載入中…';
  $('scroller').scrollTop = 0;
  history.pushState({ v: 1 }, '');
  updateBar(); requestWake();
  let tex;
  try { tex = await tabText(tab); }
  catch (e) { $('msg').textContent = e.code === 'notoken' ? '還沒連線，回譜架按「連線設定」' : '譜載入失敗（' + e.message + '）'; return; }
  if (V.tab !== tab) return;
  if (!window.alphaTab) { $('msg').textContent = '樂譜引擎載入失敗（要有網路才能第一次載入）'; return; }
  makeApi(tex);
}

function makeApi(tex) {
  if (V.api) { try { V.api.destroy(); } catch {} V.api = null; }
  $('score').innerHTML = '';
  const api = new alphaTab.AlphaTabApi($('score'), {
    core: { fontDirectory: AT_BASE + 'font/', useWorkers: false },
    display: { scale: V.pref.scale * autoScale(), staveProfile: alphaTab.StaveProfile.Tab, layoutMode: alphaTab.LayoutMode.Page },
    notation: { elements: { scoreWordsAndMusic: false, guitarTuning: false, effectDynamics: false } },
    player: {
      enablePlayer: true, enableCursor: true, enableUserInteraction: true,
      soundFont: AT_BASE + 'soundfont/sonivox.sf2',
      scrollElement: $('scroller'), scrollMode: alphaTab.ScrollMode.Continuous, scrollOffsetY: -80,
    },
  });
  V.api = api;
  api.renderFinished.on(() => { $('msg').classList.add('hidden'); hideBarSoon(); });
  api.error.on(e => { $('msg').classList.remove('hidden'); $('msg').textContent = '譜檔解析失敗：' + ((e && e.message) || e); });
  api.playerReady.on(() => { applyAudio(); updateBar(); });
  api.playerStateChanged.on(e => { V.playing = e.state === 1; updateBar(); if (!V.playing) showBar(); else hideBarSoon(); });
  api.playerFinished.on(() => { V.playing = false; updateBar(); toast('彈完了'); });
  try { api.tex(tex); } catch (e) { $('msg').textContent = '譜檔解析失敗：' + e.message; }
}

function applyAudio() {
  const api = V.api; if (!api) return;
  api.playbackSpeed = V.pref.speed / 100;
  api.masterVolume = V.pref.sound ? 1 : 0;
  api.metronomeVolume = V.pref.metro ? 1 : 0;
}

function closeViewer() {
  if (V.api) { try { V.api.stop(); V.api.destroy(); } catch {} V.api = null; }
  $('score').innerHTML = '';
  V.tab = null; V.playing = false;
  releaseWake();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  $('viewer').classList.add('hidden'); $('home').classList.remove('hidden');
  renderList();
}

function updateBar() {
  const ready = !!(V.api && V.api.isReadyForPlayback);
  $('playBtn').disabled = !ready; $('stopBtn').disabled = !ready;
  $('playBtn').textContent = !ready ? '載入音色…' : V.playing ? '⏸ 暫停' : '▶ 播放';
  $('playBtn').classList.toggle('on', V.playing);
  if (!V.pref) return;
  $('soundBtn').textContent = V.pref.sound ? '🔊' : '🔇';
  $('metroBtn').classList.toggle('on', V.pref.metro);
  const bpm = V.tab && V.tab.tempo ? `♩=${Math.round(V.tab.tempo * V.pref.speed / 100)} · ` : '';
  $('speedLbl').textContent = `${bpm}${V.pref.speed}%`;
}

function togglePlay() { if (V.api && V.api.isReadyForPlayback) V.api.playPause(); }
function setSpeed(d) { V.pref.speed = Math.min(150, Math.max(30, V.pref.speed + d)); savePref(); applyAudio(); updateBar(); toast(`速度 ${V.pref.speed}%`, 900); }
function toggleSound() { V.pref.sound = !V.pref.sound; savePref(); applyAudio(); updateBar(); toast(V.pref.sound ? '聲音開' : '聲音關：只有游標在走', 1200); }
function toggleMetro() { V.pref.metro = !V.pref.metro; savePref(); applyAudio(); updateBar(); toast(V.pref.metro ? '節拍器開' : '節拍器關', 900); }
function zoom(d) {
  V.pref.scale = Math.min(2, Math.max(0.5, Math.round((V.pref.scale + d) * 10) / 10)); savePref();
  if (V.api) { V.api.settings.display.scale = V.pref.scale * autoScale(); V.api.updateSettings(); V.api.render(); }
  toast(`譜大小 ${Math.round(V.pref.scale * 100)}%`, 900);
}
function page(dir) { const el = $('scroller'); el.scrollBy({ top: dir * el.clientHeight * 0.8, behavior: 'smooth' }); }

/* 工具列：點畫面空白處叫出來，播放中幾秒沒動自動收起 */
function showBar() { $('viewer').classList.remove('bar-off'); hideBarSoon(); }
function hideBarSoon() { clearTimeout(V.barTimer); V.barTimer = setTimeout(() => { if (V.tab && V.playing) $('viewer').classList.add('bar-off'); }, 3000); }

async function requestWake() { try { if ('wakeLock' in navigator) V.wake = await navigator.wakeLock.request('screen'); } catch {} }
function releaseWake() { try { V.wake && V.wake.release(); } catch {} V.wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && V.tab) requestWake(); });

$('backBtn').onclick = () => history.back();
$('playBtn').onclick = togglePlay;
$('stopBtn').onclick = () => { if (V.api) { V.api.stop(); $('scroller').scrollTop = 0; } };
$('soundBtn').onclick = toggleSound;
$('metroBtn').onclick = toggleMetro;
$('slowBtn').onclick = () => setSpeed(-5);
$('fastBtn').onclick = () => setSpeed(5);
$('zoomOutBtn').onclick = () => zoom(-0.1);
$('zoomInBtn').onclick = () => zoom(0.1);
$('fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('viewer').requestFullscreen().catch(() => {});
$('bar').addEventListener('click', e => e.stopPropagation());
$('scroller').addEventListener('click', () => showBar());
addEventListener('popstate', () => { if (V.tab) closeViewer(); });
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (V.api && V.pref) { V.api.settings.display.scale = V.pref.scale * autoScale(); V.api.updateSettings(); V.api.render(); } }, 300); });

/* 鍵盤與藍牙翻頁踏板：踏板多半送 PageDown／PageUp 或方向鍵，用來往下／往上捲一頁 */
addEventListener('keydown', e => {
  if (!V.tab || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (['ArrowRight', 'ArrowDown', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); page(1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k)) { e.preventDefault(); page(-1); }
  else if (k === 'Home') $('stopBtn').click();
  else if (k === '-' || k === '_') setSpeed(-5);
  else if (k === '+' || k === '=') setSpeed(5);
  else if (k === 'm' || k === 'M') toggleSound();
  else if (k === 'k' || k === 'K') toggleMetro();
  else if (k === 'f' || k === 'F') $('fsBtn').click();
  else if (k === 'Escape' && !document.fullscreenElement) history.back();
  else return;
  showBar();
});

/* Android App（WebView 外殼）按返回鍵時先問網頁：看譜中就回譜架 */
window.GT = {
  onBack() {
    if (V.tab) { history.back(); return true; }
    if (!$('connect').classList.contains('hidden')) { $('connect').classList.add('hidden'); return true; }
    return false;
  },
};

renderList();
refreshLib();
</script>
</body>
</html>
