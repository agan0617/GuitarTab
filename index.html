<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吉他譜架</title>
<meta name="theme-color" content="#1f2933">
<style>
:root {
  --bg: #f4f1ea; --fg: #1f2933; --muted: #6b7280; --card: #ffffff; --line: #e5e1d8;
  --accent: #2f7d5b; --accent-fg: #ffffff; --bar: rgba(31, 41, 51, .94); --bar-fg: #f9fafb;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15191e; --fg: #e5e7eb; --muted: #9ca3af; --card: #1f252c; --line: #2d353e; --accent: #4fb386; --accent-fg: #0b1410; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.hidden { display: none !important; }

/* ── 譜架 ── */
#home { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
.ver { text-align: right; font-size: 12px; line-height: 2; color: var(--muted); font-variant-numeric: tabular-nums; margin: calc(-10px + env(safe-area-inset-top, 0px)) 0 4px; }
.ver button, .ver a { padding: 0 2px; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
.ver .new, .ver .new a, .ver .new button { color: var(--accent); font-weight: 600; }
#home header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
#home h1 { font-size: 24px; margin: 0; }
#status { color: var(--muted); font-size: 14px; flex: 1; }
#connectBtn { color: var(--accent); font-size: 14px; }
#list { display: grid; gap: 10px; }
.tab { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.tab:hover { border-color: var(--accent); }
.tab .t { font-size: 18px; font-weight: 600; }
.tab .m { color: var(--muted); font-size: 13px; }
.tab .grow { flex: 1; min-width: 0; }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
/* 搜尋與分類（跟 K書吧同一套：類型一排、譜種一排，點一下篩、再點一下回全部；搜尋時找整個譜架） */
#search { position: relative; margin: 0 0 12px; }
#search svg { position: absolute; left: 12px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#search input { width: 100%; height: 40px; padding: 0 12px 0 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--fg); font: inherit; font-size: 15px; }
#search input:focus { outline: none; border-color: var(--accent); }
.chips { display: flex; gap: 8px; margin: 0 0 10px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
@media (hover: hover) and (pointer: fine) { .chips { flex-wrap: wrap; overflow-x: visible; } }
.chips .lbl { flex: none; align-self: center; font-size: 12px; color: var(--muted); min-width: 2.2em; }
.chip { flex: none; white-space: nowrap; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 14px; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] b { color: var(--accent); }
#listHead { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
#listSub { color: var(--muted); font-size: 13px; flex: 1; }
#sortSel { height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; font-size: 13px; }
#connect { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
#connect p { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
#connect input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
#connect .row { display: flex; gap: 8px; margin-top: 10px; }
.btn { padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }

/* ── 看譜 ── */
#viewer { position: fixed; inset: 0; --vbg: #ffffff; --vmsg: #6b7280; --vacc: 47, 125, 91; background: var(--vbg); color: #1f2933; transition: background .2s; }
#scroller { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: 72px; }
#score { max-width: 1400px; margin: 0 auto; }
#msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--vmsg); font-size: 15px; pointer-events: none; text-align: center; padding: 24px; }
/* alphaTab 播放游標（顏色跟著看譜底色換） */
.at-cursor-bar { background: rgba(var(--vacc), .1); }
.at-cursor-beat { background: rgba(var(--vacc), .75); width: 3px; }
.at-highlight * { fill: rgb(var(--vacc)); stroke: rgb(var(--vacc)); }
.at-selection div { background: rgba(var(--vacc), .18); }

#bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 2px; flex-wrap: wrap; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--bar); color: var(--bar-fg); font-size: 15px; transition: transform .2s; z-index: 5; }
#viewer.bar-off #bar { transform: translateY(110%); }
#bar button { min-width: 40px; height: 40px; padding: 0 9px; border-radius: 8px; color: var(--bar-fg); white-space: nowrap; }
#bar button:hover { background: rgba(255,255,255,.12); }
#bar button.on { background: #2f7d5b; }
#bar button:disabled { opacity: .4; }
#bar .title { flex: 1; min-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
#bar .sep { width: 1px; height: 24px; background: rgba(255,255,255,.2); margin: 0 3px; }
#bar select { height: 40px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent; color: var(--bar-fg); font: inherit; font-size: 14px; cursor: pointer; }
#bar select:hover { background: rgba(255,255,255,.12); }
#bar select option { background: #1f2933; color: #f9fafb; }
#bar .lbl { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; }
/* 音量面板：貼在工具列上緣，跟工具列一起收起 */
#mixer { position: absolute; right: 8px; bottom: 100%; margin-bottom: 6px; width: min(320px, calc(100vw - 16px)); padding: 10px 14px; border-radius: 10px; background: var(--bar); color: var(--bar-fg); display: grid; grid-template-columns: auto 1fr 3.2em; align-items: center; gap: 8px 10px; font-size: 14px; }
#mixer input { width: 100%; accent-color: #4fb386; }
#mixer .v { text-align: right; font-variant-numeric: tabular-nums; }
#mixer .v.off { opacity: .5; }
@media (max-width: 640px) {
  #bar .title, #bar .sep { display: none; }
  #bar button { min-width: 34px; padding: 0 6px; }
  #bar .lbl { min-width: 0; font-size: 13px; }
  #bar select { padding: 0 2px; font-size: 13px; }
}
/* 和弦歌詞譜（ChordPro）：和弦標在那個字的正上方，顏色跟著看譜底色換 */
#viewer.chords #soundBtn,#viewer.chords #metroBtn, #viewer.chords #mixBtn, #viewer.chords #soundSel, #viewer.chords #mixer { display: none; }
.cs { --cs-fg: #1f2933; --cs-ch: #c80000; --cs-sub: #6b7280; color: var(--cs-fg); max-width: 900px; margin: 0 auto; padding: 24px 20px 40vh; font-size: calc(18px * var(--cs-scale, 1)); line-height: 1.35; }
.cs h2 { font-size: 1.5em; margin: 0 0 .1em; }
.cs .meta { color: var(--cs-sub); font-size: .85em; margin-bottom: 1.2em; }
.cs .ln { display: flex; flex-wrap: wrap; align-items: flex-end; min-height: 1.4em; margin: .1em 0; }
.cs .ln.has-ch { margin-top: .5em; }
.cs .seg { display: inline-flex; flex-direction: column; white-space: pre; }
.cs .seg .c { color: var(--cs-ch); font-weight: 700; font-size: .85em; min-height: 1.2em; padding-right: .5em; }
.cs .seg .c:empty { padding-right: 0; }
.cs .ln:not(.has-ch) .seg .c { display: none; }
.cs .seg .w { min-height: 1.35em; }
.cs .grid { color: var(--cs-ch); font-weight: 700; white-space: pre-wrap; margin: .3em 0; font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
.cs .cmt { color: var(--cs-sub); font-weight: 600; margin: .9em 0 .2em; }
.cs .chorus { border-left: 3px solid var(--cs-ch); padding-left: .8em; margin: .4em 0; }
.cs pre { font-family: ui-monospace, Consolas, monospace; font-size: .8em; line-height: 1.2; overflow-x: auto; margin: .4em 0; }
.cs .gap { height: .8em; }
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--bar); color: var(--bar-fg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
#toast.on { opacity: 1; }
</style>
</head>
<body>

<main id="home">
  <div class="ver" id="verLine"></div>
  <header>
    <h1>吉他譜架</h1>
    <span id="status"></span>
    <button id="connectBtn" type="button">連線設定</button>
  </header>
  <section id="connect" class="hidden">
    <p>譜存在私有 repo 的 <code>saves/guitartab/</code>。這台裝置的瀏覽器連過 K書吧的話會自動沿用那組 token；沒有的話貼一次（只授權那個 repo、Contents 可讀即可）。</p>
    <input id="tokenInput" type="password" placeholder="GitHub fine-grained token" autocomplete="off">
    <input id="repoInput" type="text" placeholder="帳號/repo（預設 agan0617/CloudSave）" autocomplete="off" style="margin-top:8px">
    <div class="row"><button class="btn" id="saveConn" type="button">連線</button><button class="btn ghost" id="cancelConn" type="button">取消</button></div>
  </section>
  <div id="search" class="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><input type="search" id="searchInput" placeholder="搜尋歌名、歌手、類型" aria-label="搜尋譜架" autocomplete="off" enterkeyhint="search"></div>
  <div class="chips hidden" id="tagBar"></div>
  <div class="chips hidden" id="kindBar"></div>
  <div id="listHead"><span id="listSub"></span>
    <select id="sortSel" aria-label="排序"><option value="recent">最近彈</option><option value="added">加入時間</option><option value="title">歌名</option><option value="artist">歌手</option></select></div>
  <div id="list"></div>
</main>

<section id="viewer" class="hidden" aria-label="看譜">
  <div id="scroller"><div id="score"></div></div>
  <div id="msg">載入中…</div>
  <nav id="bar">
    <button id="backBtn" type="button" title="回譜架（Esc）">‹ 譜架</button>
    <span class="title" id="vTitle"></span>
    <button id="playBtn" type="button" title="播放／暫停，游標會跟著走、譜自動捲（空白鍵）" disabled>▶ 播放</button>
    <button id="stopBtn" type="button" title="回到開頭（Home）" disabled>⏮</button>
    <button id="soundBtn" type="button" title="聲音開關：關掉時只有游標在走（M）">🔊</button>
    <button id="metroBtn" type="button" title="節拍器（K）">節拍器</button>
    <button id="mixBtn" type="button" title="音量：吉他與節拍器分開調（V）">🎚</button>
    <select id="soundSel" title="音色（每首各自記住）"></select>
    <span class="sep"></span>
    <button id="slowBtn" type="button" title="慢一點（-）">－</button>
    <span class="lbl" id="speedLbl"></span>
    <button id="fastBtn" type="button" title="快一點（+）">＋</button>
    <span class="sep"></span>
    <button id="themeBtn" type="button" title="換底色：紙白／米黃／護眼綠／夜間（C）">🎨</button>
    <button id="zoomOutBtn" type="button" title="譜縮小">A−</button>
    <button id="zoomInBtn" type="button" title="譜放大">A＋</button>
    <button id="fsBtn" type="button" title="全螢幕（F）">⛶</button>
    <div id="mixer" class="hidden">
      <label for="gVol">吉他</label><input id="gVol" type="range" min="0" max="150" step="5"><span class="v" id="gVolLbl"></span>
      <label for="mVol">節拍器</label><input id="mVol" type="range" min="0" max="150" step="5"><span class="v" id="mVolLbl"></span>
    </div>
  </nav>
</section>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js"></script>
<script>
'use strict';
/* ───────── 設定與本機儲存 ─────────
   跟 K書吧在同一個網域（agan0617.github.io），所以直接讀 K書吧存的連線設定（shuxia:gh），
   這台裝置的瀏覽器連過 K書吧就不用再貼 token。自己的設定存在 guitartab:* 底下。 */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const AT_BASE = 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/';
const DIR = 'saves/guitartab/';
const DEFAULT_CONN = { owner: 'agan0617', repo: 'CloudSave', branch: '', token: '' };
const conn = () => {
  const own = LS.get('guitartab:gh', null);
  const kbook = LS.get('shuxia:gh', null);
  return Object.assign({}, DEFAULT_CONN, (own && own.token) ? own : (kbook || {}));
};
const $ = id => document.getElementById(id);
const toast = (msg, ms = 1600) => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), ms); };
const encPath = p => p.split('/').map(encodeURIComponent).join('/');

/* ───────── GitHub ───────── */
async function ghText(path) {
  const c = conn();
  if (!c.token) throw Object.assign(new Error('還沒連線'), { code: 'notoken' });
  const q = c.branch ? '?ref=' + encodeURIComponent(c.branch) : '';
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encPath(DIR + path)}${q}`, {
    cache: 'no-store',
    headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github.raw' },
  });
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { code: 'http', status: r.status });
  return await r.text();
}

/* 譜檔（alphaTex 純文字）快取在 localStorage：updatedAt 沒變就不重抓，離線也能開 */
async function tabText(tab) {
  const key = 'guitartab:tex:' + tab.id, hit = LS.get(key, null);
  if (hit && hit.v === (tab.updatedAt || tab.addedAt)) return hit.text;
  try {
    const text = await ghText(tab.file);
    LS.set(key, { v: tab.updatedAt || tab.addedAt, text });
    return text;
  } catch (e) { if (hit) return hit.text; throw e; }
}

/* ───────── 譜架 ───────── */
let lib = LS.get('guitartab:lib', { tabs: [] });
const lastPlayed = () => LS.get('guitartab:last', {});

/* 分類：類型來自 library.json 每筆的 tags（["華語", …]），譜種看 type（chords＝和弦譜，其他＝六線譜）。
   選的類型／譜種記在這台裝置；搜尋有字時找整個譜架，不管上面選了什麼。 */
const tabTags = t => Array.isArray(t.tags) ? t.tags : [];
const tabKind = t => t.type === 'chords' ? '和弦譜' : '六線譜';
const NO_TAG = '__none';
const flt = Object.assign({ tag: '', kind: '', sort: 'recent' }, LS.get('guitartab:filter', {}));
/* 排序（同 K書吧）：最近彈（沒彈過的照加入時間排在後面）／加入時間（新的在前）／歌名／歌手（同歌手再照歌名） */
const zhCmp = (a, b) => String(a || '').localeCompare(String(b || ''), 'zh-Hant', { numeric: true });
function sortTabs(list, last) {
  const added = (a, b) => zhCmp(b.addedAt, a.addedAt) || zhCmp(b.id, a.id);
  const cmp = flt.sort === 'title' ? (a, b) => zhCmp(a.title, b.title)
    : flt.sort === 'artist' ? (a, b) => zhCmp(a.artist, b.artist) || zhCmp(a.title, b.title)
    : flt.sort === 'added' ? added
    : (a, b) => (last[b.id] || 0) - (last[a.id] || 0) || added(a, b);
  return list.sort(cmp);
}
const saveFlt = () => LS.set('guitartab:filter', flt);
const sNorm = s => String(s || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');
const sTerms = q => String(q || '').normalize('NFKC').toLowerCase().split(/\s+/).filter(Boolean);
const chipHtml = (attr, key, label, n, on) => `<button class="chip" type="button" data-${attr}="${escH(key)}" aria-pressed="${on}">${escH(label)} <b>${n}</b></button>`;

function renderFilters(all, searching) {
  const tagCount = new Map(); let untagged = 0;
  all.forEach(t => { const ts = tabTags(t); if (!ts.length) untagged++; ts.forEach(x => tagCount.set(x, (tagCount.get(x) || 0) + 1)); });
  if (flt.tag && !(flt.tag === NO_TAG ? untagged : tagCount.has(flt.tag))) { flt.tag = ''; saveFlt(); }
  const kinds = new Map(); all.forEach(t => kinds.set(tabKind(t), (kinds.get(tabKind(t)) || 0) + 1));
  if (flt.kind && !kinds.has(flt.kind)) { flt.kind = ''; saveFlt(); }
  const tb = $('tagBar'), kb = $('kindBar');
  tb.classList.toggle('hidden', searching || !tagCount.size);
  kb.classList.toggle('hidden', searching || kinds.size < 2);
  const tags = [...tagCount].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-Hant'));
  tb.innerHTML = '<span class="lbl">類型</span>' + chipHtml('tag', '', '全部', all.length, !flt.tag)
    + tags.map(([x, n]) => chipHtml('tag', x, x, n, flt.tag === x)).join('') + (untagged ? chipHtml('tag', NO_TAG, '未分類', untagged, flt.tag === NO_TAG) : '');
  kb.innerHTML = '<span class="lbl">譜種</span>' + chipHtml('kind', '', '全部', all.length, !flt.kind)
    + ['六線譜', '和弦譜'].filter(k => kinds.has(k)).map(k => chipHtml('kind', k, k, kinds.get(k), flt.kind === k)).join('');
}

function renderList() {
  const last = lastPlayed();
  const all = sortTabs(lib.tabs.slice(), last);
  const list = $('list');
  $('sortSel').value = flt.sort;
  $('sortSel').classList.toggle('hidden', !all.length);
  $('search').classList.toggle('hidden', !all.length);
  const q = $('searchInput').value, terms = sTerms(q), searching = terms.length > 0;
  renderFilters(all, searching);
  if (!all.length) { $('listSub').textContent = ''; list.innerHTML = `<div class="empty">${conn().token ? '譜架是空的' : '還沒連線：按右上角「連線設定」'}</div>`; return; }
  const tabs = searching
    ? all.filter(t => { const h = sNorm([t.title, t.artist, t.source, tabKind(t), ...tabTags(t)].join(' ')); return terms.every(x => h.includes(x)); })
    : all.filter(t => (!flt.tag || (flt.tag === NO_TAG ? !tabTags(t).length : tabTags(t).includes(flt.tag))) && (!flt.kind || tabKind(t) === flt.kind));
  const label = searching ? '搜尋結果 · ' : [flt.tag && (flt.tag === NO_TAG ? '未分類' : flt.tag), flt.kind].filter(Boolean).map(x => x + ' · ').join('');
  $('listSub').textContent = `${label}${tabs.length} 首`;
  V.shown = tabs;
  if (!tabs.length) { list.innerHTML = `<div class="empty">${searching ? `找不到「${escH(q.trim())}」，可以只打歌名的一部分或換成歌手試試` : '這一類沒有譜'}</div>`; return; }
  list.innerHTML = '';
  for (const t of tabs) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab';
    const meta = [t.artist, tabTags(t).join('、'), t.type === 'chords' ? '和弦譜' : '', t.tempo ? `♩=${t.tempo}` : '', t.bars ? `${t.bars} 小節` : '', last[t.id] ? '上次 ' + new Date(last[t.id]).toLocaleDateString() : ''].filter(Boolean).join(' · ');
    b.innerHTML = `<span class="grow"><div class="t"></div><div class="m"></div></span><span aria-hidden="true">›</span>`;
    b.querySelector('.t').textContent = t.title;
    b.querySelector('.m').textContent = meta;
    b.onclick = () => openTab(t.id);
    list.appendChild(b);
  }
}

async function refreshLib() {
  const c = conn();
  if (!c.token) { $('status').textContent = '未連線'; renderList(); return; }
  $('status').textContent = '同步中…';
  try {
    const j = JSON.parse(await ghText('library.json'));
    lib = { tabs: Array.isArray(j.tabs) ? j.tabs : [] };
    LS.set('guitartab:lib', lib);
    $('status').textContent = `${c.owner}/${c.repo} · ${lib.tabs.length} 首`;
  } catch (e) {
    $('status').textContent = e.status === 404 ? '雲端還沒有譜' : e.status === 401 ? 'token 無效，請重新連線' : '離線，顯示上次的譜架';
  }
  renderList();
}

$('connectBtn').onclick = () => {
  const c = conn();
  $('repoInput').value = `${c.owner}/${c.repo}`;
  $('tokenInput').value = '';
  $('connect').classList.toggle('hidden');
};
$('cancelConn').onclick = () => $('connect').classList.add('hidden');
/* 搜尋框：打字就篩（輸入法選字中先不動）；Esc 清空；Enter 在只剩一首時直接打開 */
$('searchInput').addEventListener('input', e => { if (!e.isComposing) renderList(); });
$('searchInput').addEventListener('compositionend', () => renderList());
$('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; renderList(); e.target.blur(); }
  else if (e.key === 'Enter' && V.shown && V.shown.length === 1) { e.target.blur(); openTab(V.shown[0].id); }
});
$('sortSel').onchange = e => { flt.sort = e.target.value; saveFlt(); renderList(); e.target.blur(); };
$('home').addEventListener('click', e => {
  const c = e.target.closest('[data-tag],[data-kind]'); if (!c) return;
  if ('tag' in c.dataset) flt.tag = c.dataset.tag === flt.tag ? '' : c.dataset.tag;
  else flt.kind = c.dataset.kind === flt.kind ? '' : c.dataset.kind;
  saveFlt(); renderList();
});
$('saveConn').onclick = () => {
  const token = $('tokenInput').value.trim();
  const [owner, repo] = ($('repoInput').value.trim() || 'agan0617/CloudSave').split('/');
  if (!token) { toast('請貼上 token'); return; }
  LS.set('guitartab:gh', { owner: owner || 'agan0617', repo: repo || 'CloudSave', branch: '', token });
  $('connect').classList.add('hidden');
  refreshLib();
};

/* ───────── 看譜（alphaTab） ─────────
   譜檔是 alphaTex。播放時游標照速度一拍一拍走、譜自動捲動；聲音關掉就只剩游標，當作自動捲譜用。
   速度、聲音、節拍器、音色、縮放每首各自記住；音量大小跟著裝置走，所有譜共用。 */
const V = { tab: null, api: null, playing: false, wake: null, barTimer: 0, pref: null };
const PREF0 = { speed: 100, sound: true, metro: false, scale: 1.0, program: null };
const prefOf = id => Object.assign({}, PREF0, (LS.get('guitartab:pref', {})[id]) || {});
const savePref = () => { const all = LS.get('guitartab:pref', {}); all[V.tab.id] = V.pref; LS.set('guitartab:pref', all); };
/* 音量（%）：吉他 0～150、節拍器 0～150，所有譜共用 */
const VOL0 = { guitar: 100, metro: 100 };
const vol = () => Object.assign({}, VOL0, LS.get('guitartab:vol', {}));
/* 音色：General MIDI 的吉他音色（sonivox 音色庫都有）。pref.program 沒設就用譜檔的（alphaTex 預設 25 鋼弦） */
const SOUNDS = [[24, '尼龍', '尼龍弦木吉他'], [25, '鋼弦', '鋼弦木吉他'], [26, '爵士', '爵士電吉他'], [27, '清音', '清音電吉他'], [28, '悶音', '悶音電吉他'], [29, '破音', '破音電吉他'], [30, '失真', '失真電吉他']];
$('soundSel').innerHTML = SOUNDS.map(([p, n, full]) => `<option value="${p}" title="${full}">🎸${n}</option>`).join('');
const autoScale = () =>innerWidth < 600 ? 0.7 : innerWidth < 1000 ? 0.95 : 1.15;

/* 看譜底色：跟 K書吧的四種一樣。譜線、音符、文字一起換色；所有譜共用一個設定。
   紙白＝alphaTab 預設色。acc 是播放游標色（r, g, b）。 */
const THEMES = [
  { id: 'paper', name: '紙白', bg: '#ffffff', msg: '#6b7280', acc: '47, 125, 91',
    main: '#000000', sub: '#00000064', staff: '#a5a5a5', sep: '#222211', num: '#c80000', info: '#000000' },
  { id: 'sepia', name: '米黃', bg: '#f2e8d5', msg: '#78674f', acc: '110, 74, 38',
    main: '#3a2f22', sub: '#3a2f2270', staff: '#b5a281', sep: '#3a2f22', num: '#9a3b1f', info: '#3a2f22' },
  { id: 'green', name: '護眼綠', bg: '#d9e7d3', msg: '#55644e', acc: '46, 91, 58',
    main: '#22301f', sub: '#22301f70', staff: '#93a68a', sep: '#22301f', num: '#8a3a2a', info: '#22301f' },
  { id: 'night', name: '夜間', bg: '#0f1113', msg: '#7c858e', acc: '142, 166, 207',
    main: '#b7bec6', sub: '#b7bec680', staff: '#3e464e', sep: '#8a939b', num: '#c98a7a', info: '#b7bec6' },
];
const theme = () => THEMES.find(t => t.id === LS.get('guitartab:theme', 'paper')) || THEMES[0];
const themeRes = t => ({ mainGlyphColor: t.main, secondaryGlyphColor: t.sub, staffLineColor: t.staff, barSeparatorColor: t.sep, barNumberColor: t.num, scoreInfoColor: t.info });
function paintViewer() {
  const t = theme(), s = $('viewer').style;
  s.setProperty('--vbg', t.bg); s.setProperty('--vmsg', t.msg); s.setProperty('--vacc', t.acc);
}
function nextTheme() {
  const i = THEMES.indexOf(theme()), t = THEMES[(i + 1) % THEMES.length];
  LS.set('guitartab:theme', t.id); paintViewer();
  if (V.api) { V.api.settings.fillFromJson({ display: { resources: themeRes(t) } }); V.api.updateSettings(); V.api.render(); }
  if (V.chords) paintChords();
  toast(t.name, 900);
}

async function openTab(id) {
  const tab = lib.tabs.find(t => t.id === id);
  if (!tab) return;
  V.tab = tab; V.pref = prefOf(id); V.playing = false; V.origProgram = null; V.resume = null;
  V.chords = tab.type === 'chords';
  const last = lastPlayed(); last[id] = Date.now(); LS.set('guitartab:last', last);
  $('home').classList.add('hidden');
  $('viewer').classList.remove('hidden', 'bar-off');
  $('viewer').classList.toggle('chords', V.chords);
  $('vTitle').textContent = tab.title;
  paintViewer();
  $('msg').classList.remove('hidden'); $('msg').textContent = '載入中…';
  $('scroller').scrollTop = 0;
  history.pushState({ v: 1 }, '');
  updateBar(); requestWake();
  let tex;
  try { tex = await tabText(tab); }
  catch (e) { $('msg').textContent = e.code === 'notoken' ? '還沒連線，回譜架按「連線設定」' : '譜載入失敗（' + e.message + '）'; return; }
  if (V.tab !== tab) return;
  if (V.chords) { renderChords(tex); return; }
  if (!window.alphaTab) { $('msg').textContent = '樂譜引擎載入失敗（要有網路才能第一次載入）'; return; }
  makeApi(tex);
}

function makeApi(tex) {
  if (V.api) { try { V.api.destroy(); } catch {} V.api = null; }
  $('score').innerHTML = '';
  const api = new alphaTab.AlphaTabApi($('score'), {
    core: { fontDirectory: AT_BASE + 'font/', useWorkers: false },
    display: { scale: V.pref.scale * autoScale(), staveProfile: alphaTab.StaveProfile.Tab, layoutMode: alphaTab.LayoutMode.Page, resources: themeRes(theme()) },
    notation: { elements: { scoreWordsAndMusic: false, guitarTuning: false, effectDynamics: false } },
    player: {
      enablePlayer: true, enableCursor: true, enableUserInteraction: true,
      soundFont: AT_BASE + 'soundfont/sonivox.sf2',
      scrollElement: $('scroller'), scrollMode: alphaTab.ScrollMode.Continuous, scrollOffsetY: -80,
    },
  });
  V.api = api;
  api.scoreLoaded.on(score => { V.origProgram = score.tracks.length ? score.tracks[0].playbackInfo.program : 25; applyProgram(score); updateBar(); });
  api.renderFinished.on(() => { $('msg').classList.add('hidden'); hideBarSoon(); });
  api.error.on(e => { $('msg').classList.remove('hidden'); $('msg').textContent = '譜檔解析失敗：' + ((e && e.message) || e); });
  api.playerReady.on(() => { applyAudio(); updateBar(); });
  api.midiLoaded.on(() => {
    applyAudio();
    const r = V.resume; V.resume = null;
    if (r) { api.tickPosition = r.tick; if (r.play) api.play(); }
  });
  api.playerStateChanged.on(e => { V.playing = e.state === 1; updateBar(); if (!V.playing) showBar(); else hideBarSoon(); });
  api.playerFinished.on(() => { V.playing = false; updateBar(); toast('彈完了'); });
  try { api.tex(tex); } catch (e) { $('msg').textContent = '譜檔解析失敗：' + e.message; }
}

/* ───────── 和弦歌詞譜（type: "chords"） ─────────
   譜檔是 ChordPro 純文字：和弦用 [C] 寫在那個字前面，例：「[C]讓我掉下[Em]眼淚的」。
   支援的指令：{title} {subtitle} {artist} {key} {capo} {tempo}、{c: 段落說明}、
   {soc}/{eoc} 副歌框、{sot}/{eot} 原樣顯示（放六線譜片段、刷法）。以 | 開頭的行是和弦進行（前奏、間奏），原樣顯示。
   沒有聲音：▶ 是照速度自動往下捲，＋／－ 調捲動速度。 */
function renderChords(text) {
  if (V.api) { try { V.api.destroy(); } catch {} V.api = null; }
  const meta = {}, out = [];
  let tab = null, inChorus = false;
  const seg = (c, w) => `<span class="seg"><span class="c">${escH(c)}</span><span class="w">${escH(w)}</span></span>`;
  for (const raw of text.replace(/\r/g, '').split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const d = /^\{\s*([\w_]+)\s*(?::\s*(.*?))?\s*\}$/.exec(line.trim());
    if (tab !== null) {
      if (d && /^(eot|end_of_tab)$/.test(d[1])) { out.push(`<pre>${escH(tab.join('\n'))}</pre>`); tab = null; }
      else tab.push(raw);
      continue;
    }
    if (d) {
      const k = d[1].toLowerCase(), v = d[2] || '';
      if (k === 't') meta.title = v; else if (k === 'st') meta.subtitle = v;
      else if (['title', 'subtitle', 'artist', 'key', 'capo', 'tempo'].includes(k)) meta[k] = v;
      else if (['c', 'comment', 'ci', 'comment_italic'].includes(k)) out.push(`<div class="cmt">${escH(v)}</div>`);
      else if (k === 'soc' || k === 'start_of_chorus') { if (!inChorus) out.push('<div class="chorus">'); inChorus = true; if (v) out.push(`<div class="cmt">${escH(v)}</div>`); }
      else if (k === 'eoc' || k === 'end_of_chorus') { if (inChorus) out.push('</div>'); inChorus = false; }
      else if (k === 'sot' || k === 'start_of_tab') tab = [];
      continue;
    }
    if (!line.trim()) { out.push('<div class="gap"></div>'); continue; }
    if (/^\s*\|/.test(line)) { out.push(`<div class="grid">${escH(line.trim())}</div>`); continue; }
    /* 和弦只跟著後面第一個字（英文是第一個字詞），其餘一字一格，窄螢幕才能在句子中間換行 */
    const parts = line.split(/\[([^\]]*)\]/);
    const toks = s => s.match(/[A-Za-z0-9'’.,!?~\-]+\s*|\s+|./gu) || [];
    const run = (c, s) => { const t = toks(s); return seg(c, t.shift() || '') + t.map(x => seg('', x)).join(''); };
    let html = parts[0] ? run('', parts[0]) : '';
    for (let i = 1; i < parts.length; i += 2) html += run(parts[i], parts[i + 1] || '');
    out.push(`<div class="ln${parts.length > 1 ? ' has-ch' : ''}">${html}</div>`);
  }
  if (tab !== null) out.push(`<pre>${escH(tab.join('\n'))}</pre>`);
  if (inChorus) out.push('</div>');
  const info = [meta.artist, meta.key ? '調：' + meta.key : '', meta.capo ? 'Capo ' + meta.capo : '', meta.tempo ? '♩=' + meta.tempo : ''].filter(Boolean).join(' · ');
  $('score').innerHTML = `<div class="cs"><h2>${escH(meta.title || V.tab.title)}</h2>`
    + (meta.subtitle ? `<div class="meta">${escH(meta.subtitle)}</div>` : '')
    + (info ? `<div class="meta">${escH(info)}</div>` : '') + out.join('') + '</div>';
  paintChords();
  $('msg').classList.add('hidden');
  updateBar();
}
function paintChords() {
  const el = $('score').querySelector('.cs'); if (!el) return;
  const t = theme();
  el.style.setProperty('--cs-fg', t.main); el.style.setProperty('--cs-ch', t.num); el.style.setProperty('--cs-sub', t.msg);
  el.style.setProperty('--cs-scale', V.pref.scale * autoScale());
}
/* 自動捲動：基準每秒 30px（跟著字級放大），乘上速度% */
function scrollTick(ts) {
  if (!V.playing || !V.chords) return;
  const el = $('scroller');
  if (V.lastTs) {
    V.scrollAcc = (V.scrollAcc || 0) + (ts - V.lastTs) / 1000 * 30 * V.pref.scale * autoScale() * V.pref.speed / 100;
    const step = Math.floor(V.scrollAcc);
    if (step) { el.scrollTop += step; V.scrollAcc -= step; }
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 1) { V.playing = false; updateBar(); showBar(); toast('捲到底了'); return; }
  }
  V.lastTs = ts;
  requestAnimationFrame(scrollTick);
}
function toggleScroll() {
  V.playing = !V.playing; V.lastTs = 0; V.scrollAcc = 0;
  updateBar();
  if (V.playing) { requestAnimationFrame(scrollTick); hideBarSoon(); } else showBar();
}

/* 吉他走音軌音量／靜音，不動 masterVolume：masterVolume 是整個合成器的總音量，連節拍器一起蓋掉 */
function applyAudio() {
  const api = V.api; if (!api) return;
  const v = vol(), tracks = api.score ? api.score.tracks : [];
  api.playbackSpeed = V.pref.speed / 100;
  api.masterVolume = 1;
  api.changeTrackMute(tracks, !V.pref.sound || v.guitar === 0);
  api.changeTrackVolume(tracks, v.guitar / 100);
  api.metronomeVolume = V.pref.metro ? v.metro / 100 : 0;
}

/* 改音色：scoreLoaded 時還沒產 MIDI，直接改就好；播到一半換的話要重產 MIDI，等 midiLoaded 再接回原位置。
   alphaTex 會在第一拍放一個 Instrument 自動化（值＝原本的 program），產 MIDI 時排在 playbackInfo 之後，
   不一起改的話會被它蓋回原本的音色 */
function applyProgram(score) {
  if (!score || V.pref.program == null) return;
  const INSTR = alphaTab.model.AutomationType.Instrument;
  for (const t of score.tracks) {
    if (t.staves.some(s => s.isPercussion)) continue;
    t.playbackInfo.program = V.pref.program;
    for (const st of t.staves) for (const b of st.bars) for (const v of b.voices) for (const be of v.beats)
      for (const a of be.automations) if (a.type === INSTR) a.value = V.pref.program;
  }
}
function setProgram(p) {
  const api = V.api; V.pref.program = p; savePref();
  if (api && api.score) {
    V.resume = { tick: api.tickPosition, play: V.playing };
    if (V.playing) api.pause();
    applyProgram(api.score); api.loadMidiForScore();
  }
  updateBar(); toast('音色：' + (SOUNDS.find(s => s[0] === p) || [0, '', p])[2], 900);
}

function closeViewer() {
  if (V.api) { try { V.api.stop(); V.api.destroy(); } catch {} V.api = null; }
  $('score').innerHTML = '';
  V.tab = null; V.playing = false; V.chords = false;
  $('viewer').classList.remove('chords');
  $('mixer').classList.add('hidden');
  releaseWake();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  $('viewer').classList.add('hidden'); $('home').classList.remove('hidden');
  renderList();
}

function updateBar() {
  const ready = V.chords ? !!$('score').querySelector('.cs') : !!(V.api && V.api.isReadyForPlayback);
  $('playBtn').disabled = !ready; $('stopBtn').disabled = !ready;
  $('playBtn').textContent = V.chords ? (V.playing ? '⏸ 暫停' : '▶ 捲動') : !ready ? '載入音色…' : V.playing ? '⏸ 暫停' : '▶ 播放';
  $('playBtn').classList.toggle('on', V.playing);
  if (!V.pref) return;
  $('soundBtn').textContent = V.pref.sound ? '🔊' : '🔇';
  $('metroBtn').classList.toggle('on', V.pref.metro);
  $('soundSel').value = V.pref.program != null ? V.pref.program : (V.origProgram != null ? V.origProgram : 25);
  const v = vol();
  $('mixBtn').classList.toggle('on', !$('mixer').classList.contains('hidden'));
  $('gVol').value = v.guitar; $('mVol').value = v.metro;
  $('gVolLbl').textContent = V.pref.sound ? v.guitar + '%' : '關'; $('gVolLbl').classList.toggle('off', !V.pref.sound);
  $('mVolLbl').textContent = V.pref.metro ? v.metro + '%' : '關'; $('mVolLbl').classList.toggle('off', !V.pref.metro);
  const bpm = V.tab && V.tab.tempo ? `♩=${Math.round(V.tab.tempo * V.pref.speed / 100)} · ` : '';
  $('speedLbl').textContent = `${bpm}${V.pref.speed}%`;
}

function togglePlay() { if (V.chords) toggleScroll(); else if (V.api && V.api.isReadyForPlayback) V.api.playPause(); }
function setSpeed(d) { V.pref.speed = Math.min(150, Math.max(30, V.pref.speed + d)); savePref(); applyAudio(); updateBar(); toast(`速度 ${V.pref.speed}%`, 900); }
function toggleSound() { V.pref.sound = !V.pref.sound; savePref(); applyAudio(); updateBar(); toast(V.pref.sound ? '聲音開' : '聲音關：只有游標在走', 1200); }
function toggleMetro() { V.pref.metro = !V.pref.metro; savePref(); applyAudio(); updateBar(); toast(V.pref.metro ? '節拍器開' : '節拍器關', 900); }
/* 拉音量滑桿時順便把那一路打開：拉了卻沒聲音會以為壞了 */
function setVol(key, val) {
  const v = vol(); v[key] = val; LS.set('guitartab:vol', v);
  const on = key === 'guitar' ? 'sound' : 'metro';
  if (val > 0 && !V.pref[on]) { V.pref[on] = true; savePref(); }
  applyAudio(); updateBar(); hideBarSoon();
}
function toggleMixer() { $('mixer').classList.toggle('hidden'); updateBar(); }
function zoom(d) {
  V.pref.scale = Math.min(2, Math.max(0.5, Math.round((V.pref.scale + d) * 10) / 10)); savePref();
  if (V.api) { V.api.settings.display.scale = V.pref.scale * autoScale(); V.api.updateSettings(); V.api.render(); }
  if (V.chords) paintChords();
  toast(`譜大小 ${Math.round(V.pref.scale * 100)}%`, 900);
}
function page(dir) { const el = $('scroller'); el.scrollBy({ top: dir * el.clientHeight * 0.8, behavior: 'smooth' }); }

/* 工具列：點畫面空白處叫出來，播放中幾秒沒動自動收起 */
function showBar() { $('viewer').classList.remove('bar-off'); hideBarSoon(); }
function hideBarSoon() { clearTimeout(V.barTimer); V.barTimer = setTimeout(() => { if (V.tab && V.playing) $('viewer').classList.add('bar-off'); }, 3000); }

async function requestWake() { try { if ('wakeLock' in navigator) V.wake = await navigator.wakeLock.request('screen'); } catch {} }
function releaseWake() { try { V.wake && V.wake.release(); } catch {} V.wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && V.tab) requestWake(); });

$('backBtn').onclick = () => history.back();
$('playBtn').onclick = togglePlay;
$('stopBtn').onclick = () => {
  if (V.chords) { V.playing = false; $('scroller').scrollTop = 0; updateBar(); }
  else if (V.api) { V.api.stop(); $('scroller').scrollTop = 0; }
};
$('soundBtn').onclick = toggleSound;
$('metroBtn').onclick = toggleMetro;
$('mixBtn').onclick = toggleMixer;
$('soundSel').onchange = e => { setProgram(+e.target.value); e.target.blur(); };
$('gVol').oninput = e => setVol('guitar', +e.target.value);
$('mVol').oninput = e => setVol('metro', +e.target.value);
$('slowBtn').onclick = () => setSpeed(-5);
$('fastBtn').onclick = () => setSpeed(5);
$('themeBtn').onclick = nextTheme;
$('zoomOutBtn').onclick = () => zoom(-0.1);
$('zoomInBtn').onclick = () => zoom(0.1);
$('fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('viewer').requestFullscreen().catch(() => {});
$('bar').addEventListener('click', e => e.stopPropagation());
$('scroller').addEventListener('click', () => showBar());
addEventListener('popstate', () => { if (V.tab) closeViewer(); });
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (V.api && V.pref) { V.api.settings.display.scale = V.pref.scale * autoScale(); V.api.updateSettings(); V.api.render(); } if (V.chords) paintChords(); }, 300); });

/* 鍵盤與藍牙翻頁踏板：踏板多半送 PageDown／PageUp 或方向鍵，用來往下／往上捲一頁 */
addEventListener('keydown', e => {
  // 譜架上按 / 跳到搜尋框
  if (!V.tab && e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && !$('search').classList.contains('hidden')) { e.preventDefault(); $('searchInput').focus(); return; }
  if (!V.tab || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (['ArrowRight', 'ArrowDown', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); page(1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k)) { e.preventDefault(); page(-1); }
  else if (k === 'Home') $('stopBtn').click();
  else if (k === '-' || k === '_') setSpeed(-5);
  else if (k === '+' || k === '=') setSpeed(5);
  else if (k === 'm' || k === 'M') toggleSound();
  else if (k === 'k' || k === 'K') toggleMetro();
  else if (k === 'v' || k === 'V') toggleMixer();
  else if (k === 'f' || k === 'F') $('fsBtn').click();
  else if (k === 'c' || k === 'C') nextTheme();
  else if (k === 'Escape' && !document.fullscreenElement) history.back();
  else return;
  showBar();
});

/* ───────── 版本與更新 ─────────
   譜架最上面一行：網頁版本（WEB_VERSION），在 App 裡再加 App 版本（App 的 User-Agent 帶 GuitarTabApp/<版本>）。
   - App：打開時最多每 12 小時問一次 GitHub Releases 最新的 tag，比現在裝的新就提示下載
   - 網頁：按「檢查更新」才抓線上的 index.html 比 WEB_VERSION
   改網頁時 WEB_VERSION 要跟著改（yyyy.MM.dd.N）。 */
const WEB_VERSION = '2026.10.15.5';
const APP_REPO = 'agan0617/GuitarTabApp';
const APP_VER = (/GuitarTabApp\/([\w.]+)/.exec(navigator.userAgent) || [])[1] || '';
const escH = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function verNewer(a, b) { // a 比 b 新？逐段比數字：1.10 > 1.9、2026.10.15.2 > 2026.10.15
  const x = String(a).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
  const y = String(b).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  return false;
}
const UPD = { web: '', checking: false, checkedAt: 0 };
function renderVer() {
  const rel = APP_VER ? LS.get('guitartab:appRel', null) : null;
  const parts = [`網頁 ${escH(WEB_VERSION)}`];
  if (APP_VER) parts.push(`App ${escH(APP_VER)}`);
  let html = `<div>${parts.join(' · ')} · <button type="button" id="verCheck"${UPD.checking ? ' disabled' : ''}>${UPD.checking ? '檢查中…' : '檢查更新'}</button></div>`;
  if (UPD.web) html += `<div class="new">網頁有新版 ${escH(UPD.web)} · <button type="button" id="verReload">重新整理</button></div>`;
  if (rel && verNewer(rel.tag, APP_VER)) html += `<div class="new">App 有新版 ${escH(rel.tag.replace(/^v/i, ''))} · <a href="${escH(rel.url)}" target="_blank" rel="noopener">下載</a></div>`;
  else if (UPD.checkedAt && !UPD.web) html += `<div>${APP_VER ? '網頁和 App 都是最新版' : '已經是最新版'}</div>`;
  $('verLine').innerHTML = html;
  $('verCheck').onclick = () => checkUpdates(true);
  if ($('verReload')) $('verReload').onclick = () => location.reload();
}
async function checkAppRelease() {
  // 有 token 就帶上：沒帶的話同一個 IP 每小時只能問 60 次
  const url = `https://api.github.com/repos/${APP_REPO}/releases/latest`, token = conn().token;
  const get = auth => fetch(url, { headers: Object.assign({ Accept: 'application/vnd.github+json' }, auth ? { Authorization: 'Bearer ' + token } : {}), cache: 'no-store' });
  let r = await get(!!token);
  if (r.status === 401 && token) r = await get(false);
  if (!r.ok) throw new Error('release ' + r.status);
  const j = await r.json();
  LS.set('guitartab:appRel', { tag: j.tag_name || '', url: j.html_url || `https://github.com/${APP_REPO}/releases/latest`, at: Date.now() });
}
async function checkWeb() {
  const r = await fetch('index.html?ver=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('page ' + r.status);
  const m = /const WEB_VERSION = '([^']+)'/.exec(await r.text());
  UPD.web = m && verNewer(m[1], WEB_VERSION) ? m[1] : '';
}
async function checkUpdates(manual) {
  if (UPD.checking) return;
  if (!navigator.onLine) { if (manual) toast('沒有網路，連上再檢查'); return; }
  UPD.checking = true; renderVer();
  const jobs = [];
  if (manual) jobs.push(checkWeb());
  if (APP_VER) jobs.push(checkAppRelease());
  const res = await Promise.allSettled(jobs);
  UPD.checking = false;
  if (manual) {
    if (res.some(x => x.status === 'rejected')) toast('有一項沒檢查成功，等一下再試');
    else UPD.checkedAt = Date.now();
  }
  renderVer();
}

/* Android App（WebView 外殼）按返回鍵時先問網頁：看譜中就回譜架 */
window.GT = {
  onBack() {
    if (V.tab) { history.back(); return true; }
    if (!$('connect').classList.contains('hidden')) { $('connect').classList.add('hidden'); return true; }
    return false;
  },
};

renderList();
refreshLib();
renderVer();
if (APP_VER && Date.now() - ((LS.get('guitartab:appRel', null) || {}).at || 0) > 12 * 3600e3) checkUpdates(false);
</script>
</body>
